<script>
function expireMsftCards(){document.querySelectorAll('[data-msft-expiry]').forEach(card=>{const stale=Date.now()>=Number(card.dataset.msftExpiry),deadline=Number(card.dataset.msftSignalDeadline),passed=deadline>0&&Date.now()>=deadline;if(passed){const line=card.querySelector('.msft-recent-signal');if(line)line.textContent=line.textContent.replace(/待计划日执行|暂时观察/g,'已过执行日');}if(stale||passed){const label=card.querySelector('.msft-status'),wasActive=!label.textContent.includes('持有/观察');label.textContent='当前建议：持有/观察';if(wasActive)card.querySelector('.recommendation-reason').textContent=stale?'暂时观察。':'交易信号已过执行日，继续观察。';card.querySelector('.state-position').style.setProperty('--current-pos','50%');card.querySelectorAll('.state-step').forEach((step,i)=>{step.classList.toggle('is-current',i===1);step.removeAttribute('aria-current');if(i===1)step.setAttribute('aria-current','step');step.querySelector('.current-arrow')?.remove();if(i===1)step.insertAdjacentHTML('beforeend','<span class="current-arrow" aria-hidden="true"></span>');});}})}
document.addEventListener('DOMContentLoaded',expireMsftCards);setInterval(expireMsftCards,60000);
function expireAaplCards(){document.querySelectorAll('[data-asset-symbol="AAPL"]').forEach(card=>{const line=card.querySelector('.aapl-recent-signal');if(!line)return;const deadline=Number(line.dataset.deadline),passed=deadline>0&&Date.now()>=deadline,stale=Date.now()>=Number(line.dataset.expiry);if(passed)line.textContent=line.textContent.replace(/待计划日执行|暂时观察/g,'已过执行日');if(stale||passed){const label=card.querySelector('.aapl-status');if(!label)return;const wasActive=label.textContent.includes('加仓');label.textContent='当前建议：持有/观察';if(wasActive)card.querySelector('.recommendation-reason').textContent=passed?'加仓信号已过执行日，继续观察。':'等待新的月末加仓条件。';card.querySelector('.state-position').style.setProperty('--current-pos','0%');card.querySelectorAll('.state-step').forEach((step,i)=>{step.classList.toggle('is-current',i===0);step.removeAttribute('aria-current');if(i===0)step.setAttribute('aria-current','step');step.querySelector('.current-arrow')?.remove();if(i===0)step.insertAdjacentHTML('beforeend','<span class="current-arrow" aria-hidden="true"></span>');});}})}
document.addEventListener('DOMContentLoaded',expireAaplCards);setInterval(expireAaplCards,60000);
window.selectTodayCategory=function(button){const root=button.closest('.today-categories');root.dataset.selectedCategory=button.dataset.category;root.querySelectorAll('.guide-tabs button').forEach(b=>b.setAttribute('aria-pressed',b===button?'true':'false'));root.querySelectorAll('.today-category').forEach(panel=>panel.hidden=panel.id!==button.getAttribute('aria-controls'));};
window.ASSET_STATE_CATALOG = {{ asset_state_catalog | tojson }};
window.ASSET_DISPLAY_STATUS_MAP = {{ asset_state_map | tojson }};
window.inspectAssetState=function(button){const root=button.closest('.state-position');root.querySelectorAll('.state-step').forEach(b=>b.classList.remove('is-inspecting'));button.classList.add('is-inspecting');const current=root.querySelector('.is-current'),p=root.querySelector('.state-explanation');p.textContent=button.dataset.label+'：'+button.dataset.meaning+(button!==current?' 当前建议仍是“'+(current?.dataset.label||'暂无')+'”。':'');};
window.assetStateRail=function(summary){const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const entries=window.ASSET_STATE_CATALOG[summary.details?.strategy_id|| (summary.details?.strategy_mode==='us_monthly_trend'?'us_equity':summary.asset_type)]||[],mappedStatus=window.ASSET_DISPLAY_STATUS_MAP[summary.asset_type]?.[summary.status]||summary.status,displayStatus=summary.asset_type==='macro_asset'?(summary.details?.insufficient_history?'watch':summary.details?.heat_phase?'reduce':'buy'):!['broad_etf','sector_etf','macro_asset'].includes(summary.asset_type)&&mappedStatus==='buy'&&summary.details?.holding?'add':mappedStatus,active=entries.find(e=>e[0]===displayStatus),currentIndex=Math.max(0,entries.findIndex(e=>e[0]===displayStatus)),colors=summary.asset_type==='macro_asset'?['#5265b6','#e8bd4b']:['#7146aa','#5265b6','#347ac2','#8faaa0','#e8bd4b'];return '<div class="state-position" style="--current-pos:'+currentIndex/Math.max(1,entries.length-1)*100+'%;--axis-color:'+colors[currentIndex]+'"><div class="axis-labels"><b>'+ (summary.asset_type==='macro_asset'?'买入／持有':'买入')+'</b><span>'+ (summary.asset_type==='macro_asset'?'减仓':'卖出')+'</span></div>'+(summary.asset_type==='stock'&&summary.risk_level==='high'&&summary.status!=='exit'?'<span class="risk-badge">高风险 · 暂不新增投入</span>':'')+'<div class="axis-scroll"><div class="state-rail">'+entries.map(([code,label,tone,meaning],i)=>{const current=code===displayStatus;return '<button type="button" class="state-step'+(current?' is-current':'')+'" style="--axis-pos:'+i/Math.max(1,entries.length-1)*100+'%;--axis-color:'+colors[i]+'" data-meaning="'+escape(meaning)+'" data-label="'+escape(label)+'" onclick="inspectAssetState(this)"'+(current?' aria-current="step"':'')+'><span class="state-dot" aria-hidden="true"></span>'+escape(label)+(current?'<span class="current-arrow" aria-hidden="true"></span>':'')+'</button>';}).join('')+'</div></div><p class="current-reason"><b>当前建议：'+escape(active?.[1]||summary.action)+'</b><span class="recommendation-reason">'+escape(summary.reason)+'</span></p><p class="state-explanation" aria-live="polite"></p></div>';};
window.strategySummaryHtml=function(info){
 if(!info)return '';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const b=info.backtest,stats=b?`<dl class="strategy-stats"><div><dt>历史年化（CAGR）</dt><dd>${Number(b.annual_pct).toFixed(2)}%</dd></div><div><dt>最大回撤</dt><dd>${Number(b.max_drawdown_pct).toFixed(2)}%</dd></div></dl><p class="strategy-period">回测 ${esc(b.start)} — ${esc(b.end)}</p>`:'<p class="strategy-note">当前版本尚无已核对回测，不展示其他策略数字。</p>';
 return `<div class="strategy-summary"><p class="strategy-name">${esc(info.title)}</p>${stats}</div>`;
};
window.assetStrategyBasis=function(summary){const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));return strategySummaryHtml(summary.details?.strategy_presentation)+'<ul class="strategy-basis">'+(summary.decision_basis||[]).map(([title,text])=>'<li><b>'+escape(title)+(text==='满足'?'</b>':'：</b>'+escape(text))+'</li>').join('')+'</ul>';};
// Display preference only: keep the original summary and safety flags intact.
window.isUpdateNotice=value=>/未更新|待更新|更新失败|更新受限|等待数据更新|待数据更新|过期|过旧|网络异常/.test(String(value??''));
{const rail=window.assetStateRail,basis=window.assetStrategyBasis;
 window.assetStateRail=summary=>rail({...summary,reason:isUpdateNotice(summary.reason)?'暂时观察。':summary.reason});
 window.assetStrategyBasis=summary=>basis({...summary,decision_basis:(summary.decision_basis||[])
   .filter(([key,value])=>!(key==='行情前提'&&isUpdateNotice(value)))
   .map(([key,value])=>[isUpdateNotice(key)?'估值参考':key,isUpdateNotice(key)||isUpdateNotice(value)?'暂无':value])});}
window.selectedValuationYears=function(){if([3,5,10].includes(window.BROAD_VALUATION_YEARS))return window.BROAD_VALUATION_YEARS;try{const n=Number(localStorage.getItem('valuationYears')||5);return [3,5,10].includes(n)?n:5;}catch(e){return 5;}};
window.summaryWithValuationYears=function(summary,years){
 if(!summary||summary.asset_type!=='broad_etf'||summary.details?.strategy_mode==='us_monthly_trend')return summary;
 if(summary.details?.strategy_mode==='broad_individual'){
  if(summary.details.parameters?.fixed_valuation_years||summary.details.strategy_id?.startsWith('trend'))return summary;
  const s=JSON.parse(JSON.stringify(summary)),option=s.details.strategy_options?.[String(years)];
  if(!option){s.status='watch';s.action='观察';s.reason='所选年限没有足够估值历史，先观察。';s.details.insufficient_history=true;s.decision_basis=[['判断前提','所选估值历史不足']];return s;}
  ['status','action','reason','decision_basis','decision_conditions'].forEach(key=>s[key]=option[key]);
  s.details.valuation=option.valuation;s.details.insufficient_history=option.insufficient_history;
  s.details.strategy_presentation=option.strategy_presentation;
  s.details.parameters.valuation_years=years;s.metrics.valuation_percentile=option.valuation_percentile;
  s.details.new_money_fraction=s.status==='buy'?.5:0;
  return s;
 }
 const s=JSON.parse(JSON.stringify(summary)),v=s.details.valuation_options?.[String(years)]||{error:'所选年限没有足够估值历史'},p=s.details.parameters||{},low=p.p_low??30,high=p.p_high??70;
 const valid=Number.isFinite(v.percentile),vb=valid?(v.percentile<low?'低位':v.percentile>high?'高位':'中位'):'无法判断',pb=s.details.price_band;
 s.details.valuation_band=vb;s.details.valuation=valid?v:null;s.metrics.valuation_percentile=valid?v.percentile:null;
 const dd=s.metrics.drawdown_1y_pct,raw=s.details.drawdown_1y,labels={buy_more:'加仓',buy:'买入',watch:'观察',reduce:'减仓',exit:'退出'};
 s.status=!valid||pb==='无法判断'?'watch':v.percentile>=(p.valuation_exit_percentile??90)?'exit':vb==='高位'?'reduce':vb==='低位'&&raw>=(p.drawdown_large??.2)?'buy_more':vb==='低位'&&raw>=(p.drawdown_medium??.1)?'buy':'watch';s.action=labels[s.status];
 s.reason=!valid?'估值历史不足或过旧，先观察。':pb==='无法判断'?'价格数据不足，先观察。':'距近一年高点回撤'+dd+'%，估值处于'+vb+'，对应'+s.action+'信号。';
 const title='估值区间：'+vb+(valid?'（PE '+v.value+'，近'+years+'年分位'+v.percentile+'%，'+v.date+'，月度）':'（'+(v.error||'数据不足')+'）');
 s.decision_basis=[['价格回撤：'+pb+'（距近一年高点下跌'+dd+'%）',pb==='无法判断'?'无法判断':'满足'],[title,valid?'满足':'无法判断']];
 s.decision_conditions=s.decision_basis.map(([condition,result])=>({condition,result,met:result==='满足'?true:null}));return s;
};
window.refreshValuationPreference=function(){
 const years=selectedValuationYears(),select=document.getElementById('valuationYears');if(select)select.value=String(years);
 const list=(window.STRATEGY_SUMMARIES||[]).filter(Boolean).map(s=>summaryWithValuationYears(s,years));
 for(const s of list){if(s.asset_type!=='broad_etf')continue;const card=document.querySelector('[data-asset-symbol="'+s.symbol+'"]');if(!card)continue;const rail=card.querySelector('.state-position'),basis=card.querySelector('.strategy-basis');if(rail)rail.outerHTML=assetStateRail(s);if(basis){card.querySelector('.strategy-summary')?.remove();basis.outerHTML=assetStrategyBasis(s);}}
 if(window.setInvestmentSummaries)window.setInvestmentSummaries(list);
 window.TODAY_STRATEGY_SUMMARIES=list;
 window.TODAY_STRATEGY_SOURCE=window.STRATEGY_SUMMARIES;
 window.dispatchEvent(new Event('strategy-signals-updated'));
};
window.changeValuationYears=function(value){if(![3,5,10].includes(Number(value)))return;window.BROAD_VALUATION_YEARS=Number(value);try{localStorage.setItem('valuationYears',String(value));}catch(e){}refreshValuationPreference();};
document.addEventListener('DOMContentLoaded',refreshValuationPreference);
</script>
