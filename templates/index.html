<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星循 · 观察周期，记录投资</title>

{% include "_styles.html" %}
</head>
<body>
{% include "_status_rail.html" %}
<header>
  <div class="brand-heading"><h1>星循</h1><span class="brand-tagline">观察周期，记录投资</span></div>
  <nav id="topnav">
    <a data-t="today" class="active"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2m6 2V2M8 10h8m-8 4h5"/></svg><span>今日提醒</span></a>
    <a data-t="plan"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M6 16v-5m6 5V5m6 11V8"/></svg><span>投资配置</span></a>
    <a data-t="review"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6C9 4 5 4 3 5v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-2-1-6-1-9 1v15Z"/></svg><span>投资复盘</span></a>
    <a data-t="lab"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6 6-2Z"/></svg><span>策略实验</span></a>

  </nav>
</header>

<main>
{% include "_invest_tools.html" %}
  <!-- ================= 今日提醒 ================= -->
  <section id="sec-today">
    <button class="btn gray" onclick="loadAlerts()">刷新今日提醒</button>
    <div id="todayOut"></div>
  </section>

</main>

<footer style="color:#9c8f79;font-size:12px;text-align:center;padding:20px">
  数据来源 AkShare（东方财富/新浪）；仅供策略研究，不构成投资建议。
</footer>

<script>
let STATE=null;
const $=s=>document.querySelector(s);
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadAlerts(){
  const box=$('#todayOut');
  const selectedCategory=box.querySelector('.today-categories')?.dataset.selectedCategory||box.dataset.selectedCategory||'broad';
  box.dataset.selectedCategory=selectedCategory;
  box.innerHTML='<div>加载中…（首次需联网拉数据，稍候）</div>';
  const payload={params:(STATE.saved?.params||STATE.defaults),sell_rules:(STATE.saved?.sell_rules||STATE.sell_rules)};
  try{
    const r=await fetch('/api/alerts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const list=await r.json();
    window.STRATEGY_SUMMARIES=list.map(it=>it.summary).filter(Boolean);
    box.innerHTML={{ today_categories | tojson }};
    selectTodayCategory(box.querySelector('[data-category="'+box.dataset.selectedCategory+'"]'));
    for(const it of list){
      const card=document.createElement('div'); card.className='card';card.dataset.assetSymbol=it.code;
      const meta=STATE.etfs.find(e=>e.code===it.code)||it;
      const target=meta.strategy_mode==='us_monthly_trend'?$('#usList'):meta.asset_type==='macro_asset'?$('#macroList'):meta.asset_type==='sector_etf'?$('#industryList'):$('#broadList');
      if(it.error){ card.innerHTML=`<b>${it.code} ${it.name}</b><div class="err">${it.error}</div>`; target.appendChild(card); continue; }
      const s=it.summary, m=s.metrics;
      card.innerHTML=`<h2>${safeText(it.name)} <span class="muted">${safeText(it.code)}</span></h2>
        <p>数据日 ${s.date} · 当前 ${m.price} · 当日涨跌 ${m.day_change_pct==null?'暂无':m.day_change_pct.toFixed(2)+'%'}</p>
        ${assetStateRail(s)}${it.signal_code?`<p class="muted">参考行情：${it.signal_code}；并非联接基金实际净值。</p>`:''}
        <details><summary>查看判断依据</summary>${assetStrategyBasis(s)}</details>
`;
      target.appendChild(card);
    }
    refreshValuationPreference();
  }catch(e){ box.innerHTML='<div class="err">'+e+'</div>'; }
}


async function init(){try{const r=await fetch('/api/state');STATE=await r.json();await loadAlerts();}catch(e){$('#todayOut').textContent='今日提醒暂不可用，请稍后刷新。';}}
init();
</script>


</body>
</html>
