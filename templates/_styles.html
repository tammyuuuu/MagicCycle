.workspace .fund-picker-toggle{flex:0 0 40px;width:40px;height:42px;min-height:42px;padding:0;margin:0;border:0;background:transparent var(--select-arrow) no-repeat right 12px center;background-size:16px 16px;color:var(--ink);font-size:0;line-height:1;}
.fund-picker-list{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:20;max-height:230px;overflow-y:auto;overscroll-behavior:contain;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px #202e4b18;}

.etf-monitor>.etf-monitor-title{font-size:16px;font-weight:600;line-height:2;color:var(--ultra);margin:0 0 12px;}
