<style>

.asset-list > .card{margin:0px;}
.page-section{grid-column:1 / -1;min-width:0px;}
.hidden{display:none!important;}

.state-rail{display:flex;position:relative;isolation:isolate;}

.workspace{margin:auto;min-width:0px;width:100%;grid-column:1 / -1;}
