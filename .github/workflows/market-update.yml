name: Update market snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'
concurrency:
  group: cycle-market-update
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_market_safety test_close_validation test_pages_release -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            data_cache
            stock_monitor_data
          key: cycle-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cycle-market-v1-
      - name: Generate and validate
        run: |
          python -u export_alerts.py
          python cloud_market_check.py
          python verify_pages_release.py
      - uses: actions/cache/save@v4
        with:
          path: |
            data_cache
            stock_monitor_data
          key: cycle-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish snapshot to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshots"
            git push origin HEAD:main
          fi
      - name: Request branch-based Pages build
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Verify published release
        run: python -u verify_pages_release.py --url "https://tammyuuuu.github.io/MagicCycle/" --attempts 40 --interval 15
