name: Update market snapshots
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger source (manual or independent watchdog)'
        required: false
        default: manual
  schedule:
    # UTC: primary 16:30 Beijing; catch-up 17:17, 19:17, 21:17.
    # GitHub schedules are best-effort; the independent Windows watchdog
    # can dispatch this same workflow when the published data remains old.
    - cron: '30 8 * * 1-5'
    - cron: '17 9,11,13 * * 1-5'
concurrency:
  group: cycle-market-update
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Record trigger and runner timing
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_REASON: ${{ inputs.reason }}
        run: |
          python -c "import os,datetime,json; print(json.dumps({k:os.getenv(k) for k in ['GITHUB_RUN_ID','GITHUB_SHA','TRIGGER_EVENT','TRIGGER_SCHEDULE','TRIGGER_REASON']})); print('runner_utc='+datetime.datetime.now(datetime.timezone.utc).isoformat())"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '{event,created_at,run_started_at,head_sha}' || echo 'Run timing API unavailable; continuing update'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_market_safety test_close_validation test_pages_release test_stock_update test_update_watchdog -v
      - name: Decide whether catch-up is needed
        id: due
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python update_watchdog.py --cloud-check
      - uses: actions/cache/restore@v4
        if: steps.due.outputs.due == 'true'
        with:
          path: |
            data_cache
            stock_monitor_data
          key: cycle-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cycle-market-v1-
      - name: Generate and validate
        if: steps.due.outputs.due == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Market generation attempt ${attempt}/3"
            if python -u export_alerts.py && python cloud_market_check.py && python verify_pages_release.py; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo 'Generation or validation failed; retain existing published release and retry in 45 seconds'
            sleep 45
          done
      - uses: actions/cache/save@v4
        if: steps.due.outputs.due == 'true'
        with:
          path: |
            data_cache
            stock_monitor_data
          key: cycle-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish snapshot to main
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshots"
            git push origin HEAD:main
          fi
      - name: Request branch-based Pages build
        if: steps.due.outputs.due == 'true'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Verify published release
        if: steps.due.outputs.due == 'true'
        run: python -u verify_pages_release.py --url "https://tammyuuuu.github.io/MagicCycle/" --attempts 40 --interval 15
