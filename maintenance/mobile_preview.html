<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星循 · 手机预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e6;color:#293344;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
.toolbar{position:sticky;top:0;z-index:2;padding:14px 16px;background:#fffefaf5;border-bottom:1px solid #d9ddd5}
.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.title{font-weight:600;font-size:16px}
button,select{font:inherit;color:inherit;background:#fffefa;border:1px solid #ccd3d8;border-radius:8px;padding:7px 10px;cursor:pointer;min-height:38px}
button:hover{background:#f7efde}.note{text-align:center;color:#66717f;font-size:13px;margin:8px 0 0}
.stage{padding:20px 8px 30px;overflow-x:auto}.phone{width:375px;height:812px;margin:auto;background:#202e4b;border-radius:24px;box-shadow:0 12px 36px #202e4b22;overflow:hidden;outline:6px solid #202e4b}
iframe{display:block;width:100%;height:100%;border:0;background:#f5f4ef}.tabs{margin-top:10px}.tabs button{padding:5px 10px;min-height:34px}
</style>
<div class="toolbar">
 <div class="row"><span class="title">星循 · 手机预览</span><select id="size" aria-label="手机尺寸"><option value="320,740">小屏 320</option><option value="375,812" selected>标准 375</option><option value="390,844">标准 390</option><option value="430,932">大屏 430</option></select><button id="refresh">刷新预览</button></div>
 <div class="row tabs"><button data-page="today">今日提醒</button><button data-page="plan">投资配置</button><button data-page="review">投资复盘</button><button data-page="lab">策略实验</button></div>
 <p class="note">本地预览 · 修改后自动更新 · 无需 Git 同步<br>预览账本独立于手机；请勿用它记录真实交易。</p>
</div>
<div class="stage"><div class="phone" id="phone"><iframe id="screen" title="可交互手机网页预览" src="/preview/index.html"></iframe></div></div>
<script>
const screen=document.getElementById('screen'),phone=document.getElementById('phone');let active='today',scroll=0,version='';
function choose(page){active=page;const link=screen.contentDocument?.querySelector('#topnav a[data-page="'+page+'"]');if(link)link.click();}
function reload(){const win=screen.contentWindow;active=win.document.querySelector('#topnav a.active')?.dataset.page||active;scroll=win.scrollY;screen.src='/preview/index.html?v='+Date.now();}
screen.addEventListener('load',()=>{choose(active);requestAnimationFrame(()=>screen.contentWindow.scrollTo(0,scroll));});
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{scroll=0;choose(b.dataset.page);});
document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');phone.style.width=w+'px';phone.style.height=h+'px';};
document.getElementById('refresh').onclick=reload;
setInterval(async()=>{try{const response=await fetch('/__version',{cache:'no-store'});if(!response.ok)return;const next=await response.text();if(version&&version!==next)reload();version=next;}catch{}},2000);
</script>
</html>
